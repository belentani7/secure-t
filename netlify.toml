[build]
  publish = "."

# 404 real: la ruta inexistente sirve 404.html con status 404
# (nunca status 200 sobre index.html: enmascararía enlaces rotos).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
