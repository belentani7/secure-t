[build]
  # El sitio es estatico: portada, campus y datos abiertos.
  # NO publicar la raiz del repositorio: dejaria accesibles por URL los
  # scripts de Python, los volcados de terminal y las notas internas.
  # Sincroniza biblia + conceptos desde la raiz (fuente unica) antes de publicar.
  command = "mkdir -p public/conceptos public/ui && cp -f conceptos/index.html conceptos/conceptos.json public/conceptos/ && cp -f ui/biblia.js public/ui/biblia.js"
  publish = "public"

# 404 real: la ruta inexistente sirve 404.html con status 404
# (nunca status 200 sobre index.html: enmascararia enlaces rotos).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cabeceras extra para el material del campus: es contenido educativo
# publico, pero conviene impedir que se incruste en otros sitios.
[[headers]]
  for = "/campus/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
