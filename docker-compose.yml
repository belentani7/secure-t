services:
  # Optional demo API and SPA; the public campus is deployed as static files.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm dev --host 0.0.0.0
    profiles:
      - dev
