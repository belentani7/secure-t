# Local development only. Secrets must be supplied by an untracked .env or shell.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: secure_t
      POSTGRES_USER: secure_t
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in untracked .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - secure_t_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in untracked .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in untracked .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - secure_t_minio:/data
volumes:
  secure_t_pg:
  secure_t_minio:
