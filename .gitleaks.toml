# secure-t - configuracion de gitleaks
title = "secure-t"

[extend]
useDefault = true

[[rules]]
id = "deepseek-api-key"
description = "Clave de API de DeepSeek (formato sk- + 32 hex)."
regex = '''\bsk-[a-f0-9]{32}\b'''
keywords = ["sk-"]

[[allowlists]]
description = "REDACTED placeholders from secret cleanup"
paths = ['''.*''']
regexes = ['''\bREDACTED\b''']

[[allowlists]]
description = "Textos de traduccion i18n: contienen literales que parecen claves."
paths = ['''(?i)src/i18n/''']

[[allowlists]]
description = "Fixtures de tests con valores de ejemplo conocidos."
paths = [
  '''(?i)(^|/)tests/fixtures/''',
  '''(?i)(^|/)tests/data/''',
]
regexes = [
  '''EXAMPLE_''',
  '''MOCK_''',
  '''FAKE_''',
  '''REDACTED''',
]

[[allowlists]]
description = "Material del curso: ejemplo curl con basic-auth para uso docente."
ruleID = "curl-auth-user"
paths = ['''(?i)campus/cursos/ciber-ofensiva/''']
