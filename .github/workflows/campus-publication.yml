name: Campus publication

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-campus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest==8.3.4
      - name: Campus and publication tests
        run: python -m pytest -q tests/
      - name: Offline isolation and education engine
        run: node --test tests/service-worker.test.mjs lib/edu-engine/tests/quiz.test.mjs
      - name: Build and validate actual publication artifact
        run: python scripts/build_site.py
