name: Verify SECURE T production campus
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install without destructive migration
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Verify TypeScript contracts
        run: npm run typecheck
      - name: Check real React entry, translations and deployment contract
        run: node --test tests/*.test.mjs
      - name: Exercise React component tests
        run: npm test
      - name: Build live campus content
        run: npm run build
      - name: Prove bundle and educational assets exist
        run: node scripts/verify-bundle.mjs
