# Publica SOLO el sitio (portada + campus clásico + campus AURUM + datos
# abiertos) en GitHub Pages.
# Evita que los scripts, los tests y el material de trabajo queden accesibles por URL.
# Requisito unico: Settings -> Pages -> Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://belentani7.github.io/secure-t/
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Dependencias y contenido
        run: |
          pnpm install --frozen-lockfile
          pnpm content:all
      - name: Compilar el campus AURUM como sitio estatico
        env:
          NEXT_PUBLIC_BASE_PATH: /app
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}app
        run: pnpm --filter @secure-t/web build:pages
      - name: Ensamblar _site con lista blanca
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}app
        run: node tools/build-site.mjs --sin-web
      - name: Barrera final anti-secretos
        run: |
          if grep -rEn "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY" _site; then
            echo "::error::Posible secreto en el sitio"; exit 1
          fi
          echo "Publicando $(find _site -type f | wc -l) archivos en $SITE_URL"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
