# Publica SOLO el sitio (portada + campus + open-data) en GitHub Pages.
# Evita que scripts, docs internos o archivos de trabajo queden expuestos.
# Requisito único: Settings → Pages → Source = "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  SITE_URL: https://belentani7.github.io/secure-t/
  # (el antiguo destino belentani7.github.io/secure-t-university redirige aquí)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensamblar _site con lista blanca
        run: |
          mkdir -p _site
          cp index.html 404.html campus.html STORY.md _site/
          cp -r campus ui _site/
          mkdir -p _site/public && cp -r public/open-data public/.well-known public/robots.txt public/sitemap.xml public/humans.txt _site/public/
          cp public/robots.txt public/sitemap.xml _site/
          touch _site/.nojekyll
          # Barrera final: ningún secreto llega a producción
          if grep -rEn "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY" _site; then
            echo "::error::Posible secreto en el sitio"; exit 1; fi
          echo "Publicando $(find _site -type f | wc -l) archivos en $SITE_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
