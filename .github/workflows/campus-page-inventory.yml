name: Campus page inventory
on:
  pull_request:
    paths:
      - "campus/**"
      - "scripts/build_site.py"
      - "scripts/audit_published_pages.py"
      - "tests/test_page_inventory.py"
      - ".github/workflows/campus-page-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test inventory
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_page_inventory.py
      - name: Build public campus
        run: python scripts/build_site.py --destination site-dist
      - name: Audit published pages
        run: python scripts/audit_published_pages.py --site site-dist --json page-inventory.json
      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-page-inventory
          path: page-inventory.json
          if-no-files-found: ignore
