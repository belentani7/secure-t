name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Retain the required check name from the existing CI repair PR #18.
  # Campus, engine and browser checks live in campus-publication.yml;
  # CodeQL runs separately for the languages actually present here.
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Domain and SPA tests
        run: pnpm test
      - name: API security and tutor privacy regression
        run: node --test tests/api-security.test.mjs
      - name: Build local SPA
        run: pnpm build

  secretos:
    name: Current source secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install checksum-verified Gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$TARBALL" "$BASE/$TARBALL"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${VERSION}_checksums.txt"
          grep " ${TARBALL}$" checksums.txt | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
      - name: Scan the current source without printing secret values
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
