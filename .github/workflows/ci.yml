# Integración continua del repositorio completo.
#
# POR QUE NO MEZCLA LOS ENTORNOS: pytest valida el campus publicado sin
# instalar Node; vitest valida los paquetes y los contratos sin Python; el motor
# educativo se prueba con Node puro. Cada job falla por su cuenta y se sabe qué
# se rompió sin leer el log entero.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  campus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar pytest
        run: pip install pytest
      - name: Tests del campus
        run: python -m pytest -q tests/
      - name: JSON valido en el campus
        run: |
          find campus -name '*.json' -print0 | xargs -0 -n1 python -m json.tool > /dev/null
          echo "JSON del campus correcto"

  secretos:
    # El binario oficial de gitleaks (licencia MIT) en lugar de una accion de
    # terceros: el escaneo queda fijado por version y verificado por SHA-256, la
    # lista blanca se pasa con `--config` (sin depender de que la accion la
    # descubra sola) y hay un control negativo que demuestra que el escaneo ve
    # los hallazgos cuando la lista blanca no esta.
    #
    # El veredicto NO es «gitleaks no encontro nada»: es «el historial completo
    # contiene exactamente los hallazgos conocidos y documentados». Cualquier
    # otro hallazgo falla el trabajo, y los aceptados se publican como avisos.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (version y SHA-256 fijados)
        env:
          GITLEAKS_VERSION: "8.24.3"
          # SHA-256 de gitleaks_8.24.3_linux_x64.tar.gz, tomado del
          # gitleaks_8.24.3_checksums.txt de la misma release.
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Control negativo (sin lista blanca el escaneo debe encontrar los falsos positivos)
        # Verifica la eficacia del control, no solo su resultado: si el escaneo
        # no ve nada cuando la lista blanca no esta, un veredicto posterior no
        # significaria nada.
        run: |
          set -euo pipefail
          # Se recorta el fichero real en la marca: el control escanea con las
          # mismas reglas que se publican, pero sin ninguna exclusion.
          sed '/^# ===SIN-LISTA-BLANCA===$/,$d' .gitleaks.toml > "$RUNNER_TEMP/sin-lista-blanca.toml"
          if gitleaks detect \
              --config "$RUNNER_TEMP/sin-lista-blanca.toml" \
              --no-banner --redact --exit-code=2 --log-level=error \
              --report-format=sarif --report-path="$RUNNER_TEMP/control.sarif"; then
            echo "::error title=gitleaks::el control negativo no encontro nada: el escaneo no esta leyendo el historial"
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const sarif = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const hallazgos = sarif.runs?.[0]?.results ?? [];
            const reglas = [...new Set(hallazgos.map((h) => h.ruleId))];
            console.log(`Control negativo: ${hallazgos.length} hallazgo(s), reglas: ${reglas.join(", ") || "ninguna"}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `CONTROL_HALLAZGOS=${hallazgos.length}\n`);
            if (hallazgos.length < 3) {
              console.log("::error title=gitleaks::el control negativo encontro menos hallazgos de los tres falsos positivos conocidos");
              process.exit(1);
            }
          ' "$RUNNER_TEMP/control.sarif"
      - name: Gitleaks (historial completo con la lista blanca del repositorio)
        id: escaneo
        run: |
          set -euo pipefail
          gitleaks detect \
            --config .gitleaks.toml \
            --no-banner --redact --exit-code=0 --log-level=info \
            --report-format=sarif --report-path=gitleaks-results.sarif
      - name: Veredicto del escaneo (solo los hallazgos conocidos y documentados)
        # La exposicion historica aceptada es real y grave (una clave del autor
        # original en un fichero que ya no existe). Se publica como aviso en
        # cada ejecucion, nunca como exito silencioso: aceptarla no la borra.
        if: always()
        env:
          RESULTADO_ESCANEO: ${{ steps.escaneo.outcome }}
        run: |
          set -euo pipefail
          informe=$(ls ./*.sarif 2>/dev/null | head -1)
          if [ -z "$informe" ]; then
            if [ "$RESULTADO_ESCANEO" = "success" ]; then
              echo "Sin informe SARIF: el escaneo termino sin hallazgos"
            else
              echo "::error title=gitleaks::el escaneo fallo sin dejar informe SARIF"
              exit 1
            fi
            exit 0
          fi
          node -e '
            const fs = require("node:fs");
            const sarif = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const hallazgos = sarif.runs?.[0]?.results ?? [];
            const aceptados = [{ regla: "generic-api-key", archivo: "fix_weeks.py" }];
            let inesperados = 0;
            for (const hallazgo of hallazgos) {
              const sitio = hallazgo.locations?.[0]?.physicalLocation ?? {};
              const archivo = sitio.artifactLocation?.uri ?? "desconocido";
              const linea = sitio.region?.startLine ?? 0;
              const texto = (hallazgo.message?.text ?? "").replace(/\s+/g, " ").slice(0, 220);
              const conocido = aceptados.some((a) => a.regla === hallazgo.ruleId && archivo.endsWith(a.archivo));
              if (conocido) {
                console.log(`::warning title=gitleaks exposicion historica aceptada::${archivo}:${linea} ${texto}`);
              } else {
                inesperados += 1;
                console.log(`::error title=gitleaks::${archivo}:${linea} ${texto}`);
              }
            }
            const control = Number(process.env.CONTROL_HALLAZGOS ?? "0");
            if (control > 0 && hallazgos.length >= control) {
              console.log(`::warning title=gitleaks diagnostico::la lista blanca no suprimio ningun hallazgo (control=${control}, final=${hallazgos.length})`);
            }
            console.log(`Hallazgos: ${hallazgos.length} (inesperados: ${inesperados})`);
            if (inesperados > 0) process.exit(1);
          ' "$informe"
      - name: Publicar el informe SARIF de gitleaks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-results.sarif
          path: gitleaks-results.sarif
          if-no-files-found: ignore

  edu-engine:
    # lib/edu-engine/.github/workflows/ci.yml NUNCA se ejecutaba: GitHub
    # solo lee workflows desde la raiz del repo, no desde subcarpetas. Este
    # job sustituye a ese archivo muerto; el README promete tests propios
    # para el motor y ahora hay CI real verificandolos.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lib/edu-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Tests del motor educativo
        run: node --test tests/quiz.test.mjs

  web:
    # Capa SPA y modulos de dominio (client/, notifications/, ai/, auth/,
    # audit/, academic/) + los paquetes nuevos del campus AURUM
    # (packages/shared, packages/agent, packages/ui) y su web.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Auditoria de dependencias (lista blanca con motivos)
        run: pnpm audit:deps
      - name: "Generar el contenido (fuente unica: campus/)"
        run: pnpm content:all
      - name: Typecheck (raiz y web)
        run: |
          pnpm typecheck
          pnpm --filter @secure-t/web typecheck
      - name: Tests vitest
        run: pnpm test
      - name: Compilar la web AURUM
        run: pnpm --filter @secure-t/web build
      - name: Export estatico (mismo codigo que va a Pages)
        run: pnpm --filter @secure-t/web build:pages
      - name: El contenido generado no quedo desincronizado
        # Compara el material (sourceDigest), no la fecha de generacion: el
        # `git diff` anterior fallaba en cada ejecucion por el reloj.
        run: pnpm check:drift
