<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1117">
  <title>Lector · secure T University</title>
  <meta name="description" content="Lector de materiales del campus secure T University.">
  <link rel="stylesheet" href="tokens.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('stt-theme')||'dark'}catch(e){}</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">← Campus</a>
  <nav aria-label="Acciones">
    <a class="btn btn-ghost" id="raw" href="#">Ver fuente</a>
    <button class="btn btn-ghost" onclick="print()">Imprimir</button>
  </nav>
</header>
<main class="wrap"><article class="doc" id="doc" aria-live="polite"><p>Cargando…</p></article></main>
<script>
/* Lector Markdown sin dependencias y a prueba de XSS:
   1) solo carga rutas .md relativas del propio campus (sin "..", sin esquemas);
   2) escapa TODO el HTML antes de transformar;
   3) solo genera enlaces http(s) o relativos. */
(function () {
  var out = document.getElementById("doc");
  var doc = new URLSearchParams(location.search).get("doc") || "";
  if (!/^[\w\-./]+\.md$/.test(doc) || doc.indexOf("..") >= 0 || doc.charAt(0) === "/") {
    out.innerHTML = "<h1>Documento no válido</h1><p><a href='index.html'>Volver al campus</a></p>";
    return;
  }
  var base = doc.replace(/[^/]*$/, "");
  document.getElementById("raw").href = doc;

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
  function safeHref(h) {
    h = h.replace(/&amp;/g, "&").trim();
    if (/^https?:\/\//i.test(h)) return h;
    if (/^[a-z][a-z0-9+.-]*:/i.test(h) || h.indexOf("//") === 0) return "#";  // bloquea javascript:, data:, etc.
    if (/^#/.test(h)) return h;
    var p = h.split("#");
    if (/\.md$/i.test(p[0])) {
      var parts = (base + p[0]).split("/"), st = [];
      parts.forEach(function (x) { if (x === "..") st.pop(); else if (x && x !== ".") st.push(x); });
      return "lector.html?doc=" + encodeURIComponent(st.join("/")) + (p[1] ? "#" + p[1] : "");
    }
    return base + h;
  }
  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, function (_, c) { return "<code>" + c + "</code>"; })
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, a, h) { return '<img alt="' + a + '" src="' + esc(safeHref(h)) + '" loading="lazy" style="max-width:100%">'; })
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, h) {
        var u = safeHref(h), ext = /^https?:/.test(u);
        return '<a href="' + esc(u) + '"' + (ext ? ' rel="noopener noreferrer" target="_blank"' : "") + ">" + t + "</a>";
      })
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  }
  function slug(t) { return t.toLowerCase().replace(/<[^>]+>/g, "").replace(/&[a-z#0-9]+;/g, "").replace(/[^\wáéíóúñü\s-]/g, "").trim().replace(/\s+/g, "-"); }

  function render(md) {
    var L = esc(md.replace(/\r/g, "")).split("\n"), h = [], i = 0;
    while (i < L.length) {
      var l = L[i];
      if (/^```/.test(l)) { var b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; h.push("<pre><code>" + b.join("\n") + "</code></pre>"); continue; }
      var m = l.match(/^(#{1,6})\s+(.*)$/);
      if (m) { var t = inline(m[2]); h.push("<h" + m[1].length + ' id="' + slug(t) + '">' + t + "</h" + m[1].length + ">"); i++; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { h.push("<hr>"); i++; continue; }
      if (/^\|/.test(l) && i + 1 < L.length && /^\|?\s*:?-{2,}/.test(L[i + 1])) {
        var row = function (r) { return r.replace(/^\||\|$/g, "").split("|").map(function (c) { return inline(c.trim()); }); };
        var th = row(l); i += 2; var rows = [];
        while (i < L.length && /^\|/.test(L[i])) rows.push(row(L[i++]));
        h.push("<table><thead><tr>" + th.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr></thead><tbody>" +
          rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>");
        continue;
      }
      if (/^&gt;\s?/.test(l)) { var q = []; while (i < L.length && /^&gt;\s?/.test(L[i])) q.push(inline(L[i++].replace(/^&gt;\s?/, ""))); h.push("<blockquote><p>" + q.join("<br>") + "</p></blockquote>"); continue; }
      if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
        var ol = /^\s*\d+\./.test(l), it = [];
        while (i < L.length && /^\s*([-*+]|\d+\.)\s+/.test(L[i])) {
          var txt = L[i++].replace(/^\s*([-*+]|\d+\.)\s+/, "")
            .replace(/^\[ \]\s/, '<input type="checkbox" disabled> ').replace(/^\[x\]\s/i, '<input type="checkbox" checked disabled> ');
          it.push("<li>" + inline(txt) + "</li>");
        }
        h.push((ol ? "<ol>" : "<ul>") + it.join("") + (ol ? "</ol>" : "</ul>")); continue;
      }
      if (!l.trim()) { i++; continue; }
      var p = []; while (i < L.length && L[i].trim() && !/^(#{1,6}\s|```|\||&gt;|\s*([-*+]|\d+\.)\s)/.test(L[i])) p.push(inline(L[i++]));
      h.push("<p>" + p.join(" ") + "</p>");
    }
    return h.join("\n");
  }

  fetch(doc).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (md) {
      md = md.replace(/^---\n[\s\S]*?\n---\n/, ""); // quita front-matter
      out.innerHTML = render(md);
      var h1 = out.querySelector("h1"); if (h1) document.title = h1.textContent + " · secure T University";
      if (location.hash) { var t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
    })
    .catch(function () { out.innerHTML = "<h1>No disponible</h1><p>Este material no está en caché sin conexión. <a href='index.html'>Volver</a></p>"; });
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
